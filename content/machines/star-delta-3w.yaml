# Démarreur étoile-triangle câblé (généré puis édité à la main).
id: star-delta-3w
version: 1
title: {fr: Démarreur étoile-triangle câblé, en: Hardwired star-delta starter}
description: {fr: 'Démarrage à tension réduite : le moteur démarre en étoile (courant de démarrage environ trois fois plus faible), puis un relais
    temporisé commute en triangle. Les contacts NF 21-22 de KM2 et KM3 interdisent leur fermeture simultanée (court-circuit entre phases).', en: 'Reduced-voltage
    starting: the motor starts in star (about one third of the starting current), then a timer relay changes over to delta. The NC 21-22 contacts
    of KM2 and KM3 prevent both closing at once (phase-to-phase short circuit).'}
mode: hardwired
viewBox: [1260, 900]
components:
- id: SRC
  type: source3
  tag: Alim.
  label: {fr: Alimentation 600 V 3φ 60 Hz, en: 600 V 3-phase 60 Hz supply}
  params: {vLL: 600}
  parts:
    main:
      at: [60, 40]
- id: DS
  type: disconnect3
  tag: SA
  label: {fr: Sectionneur principal (cadenassable), en: Main disconnect (lockable)}
  parts:
