# English translation overlay (merged onto the French source file of the same name).
title: Reversible conveyor to two bins
complaint: '"Boxes arrive in the middle of the conveyor. FORWARD sends them to the right bin, REVERSE to the left bin. I want to be able to change direction without breaking anything."'
context: 'The conveyor is driven by the panel''s reversing starter (contactors KF and KR). Program both directions with an interlock (same logic as BT-0011), then test in the scene: open the panel to press FORWARD / STOP / REVERSE. The belt direction comes from the real rotation direction of the motor, hence from the phase sequence.'
hints:
- 'It is the program of BT-0011: one seal-in per direction, each with "AND NOT the other coil".'
- 'Changing direction while running causes plugging of the motor: a good program requires STOP first.'
- 'If an NC interlock contact stays stuck closed, the wiring no longer protects: your software interlock is the second line of defense.'
