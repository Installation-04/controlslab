# SPDX-License-Identifier: AGPL-3.0-only
# Inverseur de marche câblé (avant / arrière)
# Machine définie comme données : composants (types de la bibliothèque du
# simulateur), fils (numéros de fil), cadenassage et catalogue de défauts.
id: reversing-3w
version: 1
title:
  fr: Inverseur de marche câblé (avant / arrière)
  en: Hardwired reversing starter (forward / reverse)
description:
  fr: "Démarreur inverseur : deux contacteurs (KF avant, KR arrière) dont deux phases sont croisées. Le verrouillage électrique par contacts
    NF 21-22 croisés empêche de fermer les deux contacteurs en même temps (court-circuit entre phases)."
  en: "Reversing starter: two contactors (KF forward, KR reverse) with two phases swapped. Cross-wired NC 21-22 contacts form the electrical
    interlock that prevents both contactors closing at once (phase-to-phase short circuit)."
mode: hardwired
viewBox: [1200, 760]
components:
  - id: SRC
    type: source3
    tag: Alim.
    label: {fr: Alimentation 600 V 3φ 60 Hz, en: 600 V 3-phase 60 Hz supply}
    params:
      vLL: 600
    parts:
      main: {at: [60, 40]}
  - id: DS
    type: disconnect3
    tag: SA
    label: {fr: Sectionneur principal (cadenassable), en: Main disconnect (lockable)}
    parts:
      main: {at: [60, 80]}
  - id: F1
    type: fuse
    tag: F1
    params:
      rating: 10
    label: {fr: Fusible principal L1 (10 A), en: Main fuse L1 (10 A)}
    parts:
      main: {at: [60, 170], rot: 90}
  - id: F2
    type: fuse
    tag: F2
    params:
      rating: 10
    label: {fr: Fusible principal L2 (10 A), en: Main fuse L2 (10 A)}
    parts:
