# SPDX-License-Identifier: AGPL-3.0-only
# Démarreur direct commandé par API
# Machine définie comme données : composants (types de la bibliothèque du
# simulateur), fils (numéros de fil), cadenassage et catalogue de défauts.
# Voir CONTRIBUTING.md pour le format.
id: motor-starter-plc
version: 1
title: {fr: Démarreur direct commandé par API, en: PLC-controlled across-the-line starter}
description:
  fr: "Même démarreur, mais la logique MARCHE/ARRÊT est dans l'API. L'arrêt d'urgence et le contact 95-96 du relais de surcharge restent
    câblés en série avec la bobine : la sécurité ne dépend jamais uniquement du programme."
  en: "Same starter, but START/STOP logic lives in the PLC. The E-stop and the overload 95-96 contact stay hardwired in series with the coil:
    safety never depends on the program alone."
mode: plc
viewBox: [1100, 800]
components:
  - id: SRC
    type: source3
    tag: Alim.
    label: {fr: Alimentation 600 V 3φ 60 Hz, en: 600 V 3-phase 60 Hz supply}
    params:
      vLL: 600
    parts:
      main: {at: [60, 40]}
  - id: DS
    type: disconnect3
    tag: SA
    label: {fr: Sectionneur principal (cadenassable), en: Main disconnect (lockable)}
    parts:
      main: {at: [60, 80]}
  - id: F1
    type: fuse
    tag: F1
    params:
      rating: 10
    label: {fr: Fusible principal L1 (10 A), en: Main fuse L1 (10 A)}
    parts:
      main: {at: [60, 170], rot: 90}
  - id: F2
    type: fuse
    tag: F2
    params:
      rating: 10
    label: {fr: Fusible principal L2 (10 A), en: Main fuse L2 (10 A)}
    parts:
      main: {at: [110, 170], rot: 90}
  - id: F3
    type: fuse
    tag: F3
    params:
      rating: 10
    label: {fr: Fusible principal L3 (10 A), en: Main fuse L3 (10 A)}
    parts:
      main: {at: [160, 170], rot: 90}
  - id: PE
    type: ground
    tag: MALT
    label: {fr: Barre de mise à la terre (boîtier), en: Ground bar (enclosure)}
    parts:
      main: {at: [230, 130]}
  - id: F4
    type: fuse
    tag: F4
    params:
      rating: 1
    label: {fr: Fusible primaire TC (1 A), en: CPT primary fuse (1 A)}
    parts:
      main: {at: [250, 250]}
  - id: F5
    type: fuse
    tag: F5
    params:
      rating: 1
    label: {fr: Fusible primaire TC (1 A), en: CPT primary fuse (1 A)}
    parts:
      main: {at: [250, 280]}
  - id: XF
    type: transformer
    tag: TC
    params:
      ratio: 5
    label:
      fr: Transformateur de commande 600/120 V, 250 VA
      en: Control transformer 600/120 V, 250 VA
    parts:
      main: {at: [360, 300]}
  - id: F6
    type: fuse
    tag: F6
    params:
      rating: 2
    label: {fr: Fusible secondaire (2 A), en: Secondary fuse (2 A)}
    parts:
      main: {at: [400, 420]}
  - id: GX
    type: ground
    tag: X2
    label: {fr: Mise à la terre du secondaire X2, en: X2 secondary bond}
    parts:
      main: {at: [440, 400]}
  - id: TB1
    type: terminal
    tag: "1"
    parts:
      main: {at: [500, 420]}
  - id: TB0
    type: terminal
    tag: X2
    parts:
      main: {at: [1040, 420]}
  - id: MTR
    type: motor3
    tag: M1
    params:
      vLL: 600
      fla: 5.2
    label: {fr: "Moteur 5 HP, 600 V, 5,2 A PC", en: "Motor 5 HP, 600 V, 5.2 FLA"}
    parts:
      main: {at: [60, 500]}
  - id: M
    type: contactor
    tag: M
    label: {fr: Contacteur moteur M (bobine 120 V), en: Motor contactor M (120 V coil)}
    parts:
      poles: {at: [60, 290]}
      coil: {at: [800, 610]}
      aux: {at: [520, 710]}
  - id: OL
    type: overload
    tag: OL
    params:
      fla: 5.2
    label:
      fr: Relais de surcharge thermique (réglé à 5,2 A)
      en: Thermal overload relay (set at 5.2 A)
    parts:
      heaters: {at: [60, 390]}
      nc: {at: [900, 610]}
      no: {at: [520, 560]}
  - id: PB_START
    type: pushbutton
    tag: PB2
    params:
      contact: NO
      kind: momentary
      color: green
    label: {fr: Bouton MARCHE (NO), en: START button (NO)}
    parts:
      main: {at: [520, 460]}
  - id: PB_STOP
    type: pushbutton
    tag: PB1
    params:
      contact: NC
      kind: momentary
      color: red
    label: {fr: Bouton ARRÊT (NF), en: STOP button (NC)}
    parts:
      main: {at: [520, 510]}
  - id: PB_ES
    type: pushbutton
    tag: AU
    params:
      contact: NC
      kind: mushroom
      color: red
    label:
      fr: Arrêt d'urgence (NF, à accrochage) — câblé en série avec la bobine
      en: Emergency stop (NC, latching) — hardwired in series with the coil
    parts:
      main: {at: [520, 610]}
  - id: I0
    type: plc_input
    tag: "%IX0.0"
    params:
      address: "%IX0.0"
    label: {fr: "Entrée API : MARCHE", en: "PLC input: START"}
    parts:
      main: {at: [900, 460]}
  - id: I1
    type: plc_input
    tag: "%IX0.1"
    params:
      address: "%IX0.1"
    label: {fr: "Entrée API : ARRÊT (NF)", en: "PLC input: STOP (NC)"}
    parts:
      main: {at: [900, 510]}
  - id: I2
    type: plc_input
    tag: "%IX0.2"
    params:
      address: "%IX0.2"
    label:
      fr: "Entrée API : surcharge déclenchée (97-98)"
      en: "PLC input: overload tripped (97-98)"
    parts:
      main: {at: [900, 560]}
  - id: I3
    type: plc_input
    tag: "%IX0.3"
    params:
      address: "%IX0.3"
    label: {fr: "Entrée API : arrêt d'urgence OK", en: "PLC input: E-stop healthy"}
    parts:
      main: {at: [900, 660]}
  - id: I4
    type: plc_input
    tag: "%IX0.4"
    params:
      address: "%IX0.4"
    label: {fr: "Entrée API : retour de marche M 13-14", en: "PLC input: M 13-14 run feedback"}
    parts:
      main: {at: [900, 710]}
  - id: Q0
    type: plc_output
    tag: "%QX0.0"
    params:
      address: "%QX0.0"
    label: {fr: "Sortie relais API : bobine M", en: "PLC relay output: M coil"}
    parts:
      main: {at: [640, 610]}
  - id: Q1
    type: plc_output
    tag: "%QX0.1"
    params:
      address: "%QX0.1"
    label: {fr: "Sortie relais API : voyant MARCHE", en: "PLC relay output: RUN light"}
    parts:
      main: {at: [640, 760]}
  - id: LT_RUN
    type: lamp
    tag: LV
    params:
      color: green
    label: {fr: Voyant MARCHE (vert), en: RUN pilot light (green)}
    parts:
      main: {at: [800, 760]}
  - id: J2
    type: terminal
    tag: "2"
    parts:
      main: {at: [600, 610]}
  - id: J1A
    type: terminal
    parts:
      main: {at: [500, 460]}
  - id: J1B
    type: terminal
    parts:
      main: {at: [500, 510]}
  - id: J1C
    type: terminal
    parts:
      main: {at: [500, 560]}
  - id: J1D
    type: terminal
    parts:
      main: {at: [500, 610]}
  - id: J1E
    type: terminal
    parts:
      main: {at: [500, 710]}
  - id: J1F
    type: terminal
    parts:
      main: {at: [500, 760]}
  - id: J0A
    type: terminal
    parts:
      main: {at: [1040, 460]}
  - id: J0B
    type: terminal
    parts:
      main: {at: [1040, 510]}
  - id: J0C
    type: terminal
    parts:
      main: {at: [1040, 560]}
  - id: J0D
    type: terminal
    parts:
      main: {at: [1040, 610]}
  - id: J0E
    type: terminal
    parts:
      main: {at: [1040, 660]}
  - id: J0F
    type: terminal
    parts:
      main: {at: [1040, 710]}
  - id: J0G
    type: terminal
    parts:
      main: {at: [1040, 760]}
