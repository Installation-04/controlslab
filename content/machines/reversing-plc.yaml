loto:
  isolators: [DS]
  knownLive: [[DS:L1, DS:L2], [DS:L2, DS:L3], [DS:L1, DS:L3]]
  verifyPoints: [[DS:T1, DS:T2], [DS:T2, DS:T3], [DS:T1, DS:T3], [DS:T1, PE:G], [DS:T2, PE:G], [DS:T3, PE:G], [XF:X1, XF:X2]]
  tryStart: PB_FWD
faults:
  - id: ol_open
    target: OL
    kind: nc_open
    label:
      fr: Contact 95-96 du relais de surcharge ouvert (défectueux)
      en: Overload 95-96 contact open (defective)
  - id: kf_welded
    target: KF
    kind: welded
    label: {fr: Contacts du contacteur AVANT (KF) soudés, en: FORWARD contactor (KF) contacts welded}
  - id: kr_welded
    target: KR
    kind: welded
    label: {fr: Contacts du contacteur ARRIÈRE (KR) soudés, en: REVERSE contactor (KR) contacts welded}
  - id: kf_coil_open
    target: KF
    kind: coil_open
    label: {fr: Bobine du contacteur AVANT (KF) ouverte, en: FORWARD contactor (KF) coil open}
  - id: kr_coil_open
    target: KR
    kind: coil_open
    label: {fr: Bobine du contacteur ARRIÈRE (KR) ouverte, en: REVERSE contactor (KR) coil open}
  - id: kr_nc_open
    target: KR
    kind: aux_nc_open
    label:
      fr: Contact NF 21-22 de KR ouvert (AVANT impossible)
      en: KR NC 21-22 open (FORWARD impossible)
  - id: kf_nc_stuck
    target: KF
    kind: aux_nc_stuck
    label:
      fr: Contact NF 21-22 de KF collé fermé (verrouillage inopérant)
      en: KF NC 21-22 stuck closed (interlock defeated)
  - id: kr_nc_stuck
    target: KR
    kind: aux_nc_stuck
    label:
      fr: Contact NF 21-22 de KR collé fermé (verrouillage inopérant)
      en: KR NC 21-22 stuck closed (interlock defeated)
  - id: f6_blown
    target: F6
    kind: blown
    label: {fr: Fusible secondaire F6 grillé, en: Secondary fuse F6 blown}
  - id: f4_blown
    target: F4
    kind: blown
    label:
      fr: Fusible primaire F4 du transformateur grillé
      en: CPT primary fuse F4 blown
  - id: f2_blown
    target: F2
    kind: blown
    label:
      fr: Fusible principal F2 grillé (marche monophasée)
      en: Main fuse F2 blown (single phasing)
  - id: motor_winding
    target: MTR
    kind: winding_open
    label: {fr: Enroulement du moteur ouvert (phase T2), en: Motor winding open (T2)}
plc:
  io:
    - address: "%IX0.0"
      component: I0
      label: {fr: MARCHE AVANT (NO), en: FORWARD (NO)}
    - address: "%IX0.1"
      component: I1
      label: {fr: MARCHE ARRIÈRE (NO), en: REVERSE (NO)}
    - address: "%IX0.2"
      component: I2
      label: {fr: "ARRÊT (NF : vrai = pas appuyé)", en: "STOP (NC: true = not pressed)"}
    - address: "%IX0.3"
      component: I3
      label: {fr: Surcharge déclenchée, en: Overload tripped}
    - address: "%IX0.4"
      component: I4
      label: {fr: Retour KF (13-14), en: KF feedback (13-14)}
    - address: "%IX0.5"
      component: I5
      label: {fr: Retour KR (13-14), en: KR feedback (13-14)}
    - address: "%IX0.6"
      component: IE
