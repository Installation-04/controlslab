  - id: F3
    type: fuse
    tag: F3
    params:
      rating: 10
    label: {fr: Fusible principal L3 (10 A), en: Main fuse L3 (10 A)}
    parts:
      main: {at: [160, 170], rot: 90}
  - id: PE
    type: ground
    tag: MALT
    label: {fr: Barre de mise à la terre (boîtier), en: Ground bar (enclosure)}
    parts:
      main: {at: [230, 130]}
  - id: KF
    type: contactor
    tag: KF
    label: {fr: Contacteur MARCHE AVANT (bobine 120 V), en: FORWARD contactor (120 V coil)}
    parts:
      poles: {at: [60, 300]}
      coil: {at: [1010, 540]}
      aux: {at: [830, 590]}
      aux_nc: {at: [930, 660]}
  - id: KR
    type: contactor
    tag: KR
    label: {fr: Contacteur MARCHE ARRIÈRE (bobine 120 V), en: REVERSE contactor (120 V coil)}
    parts:
      poles: {at: [280, 300]}
      coil: {at: [1010, 660]}
      aux: {at: [830, 710]}
      aux_nc: {at: [930, 540]}
  - id: OL
    type: overload
    tag: OL
    params:
      fla: 5.2
    label:
      fr: Relais de surcharge thermique (réglé à 5,2 A)
      en: Thermal overload relay (set at 5.2 A)
    parts:
      heaters: {at: [60, 430]}
      nc: {at: [1090, 420]}
  - id: MTR
    type: motor3
    tag: M1
    params:
      vLL: 600
      fla: 5.2
    label: {fr: "Moteur 5 HP, 600 V, 5,2 A PC", en: "Motor 5 HP, 600 V, 5.2 FLA"}
    parts:
      main: {at: [60, 560]}
  - id: F4
    type: fuse
    tag: F4
    params:
      rating: 1
    label: {fr: Fusible primaire TC (1 A), en: CPT primary fuse (1 A)}
    parts:
      main: {at: [430, 232]}
  - id: F5
    type: fuse
    tag: F5
    params:
      rating: 1
    label: {fr: Fusible primaire TC (1 A), en: CPT primary fuse (1 A)}
    parts:
      main: {at: [430, 252]}
  - id: XF
    type: transformer
    tag: TC
    params:
      ratio: 5
    label:
      fr: Transformateur de commande 600/120 V, 250 VA
      en: Control transformer 600/120 V, 250 VA
    parts:
      main: {at: [580, 260]}
  - id: F6
    type: fuse
    tag: F6
    params:
      rating: 2
    label: {fr: Fusible secondaire (2 A), en: Secondary fuse (2 A)}
    parts:
      main: {at: [580, 400]}
  - id: GX
    type: ground
    tag: X2
    label: {fr: Mise à la terre du secondaire X2, en: X2 secondary bond}
    parts:
      main: {at: [700, 330]}
  - id: TB1
    type: terminal
    tag: "1"
    parts:
      main: {at: [700, 400]}
  - id: TB0
    type: terminal
    tag: X2
    parts:
      main: {at: [1150, 330]}
  - id: PB_STOP
    type: pushbutton
    tag: PB1
    params:
      contact: NC
      kind: momentary
      color: red
    label: {fr: Bouton ARRÊT (NF), en: STOP button (NC)}
    parts:
      main: {at: [720, 470]}
  - id: PB_FWD
    type: pushbutton
    tag: PB2
