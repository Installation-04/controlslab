loto:
  isolators: [DS]
  knownLive: [[DS:L1, DS:L2], [DS:L2, DS:L3], [DS:L1, DS:L3]]
  verifyPoints: [[DS:T1, DS:T2], [DS:T2, DS:T3], [DS:T1, DS:T3], [DS:T1, PE:G], [DS:T2, PE:G], [DS:T3, PE:G], [XF:X1, XF:X2]]
  tryStart: PB_START
faults:
  - id: ol_open
    target: OL
    kind: nc_open
    label:
      fr: Contact 95-96 du relais de surcharge ouvert (défectueux)
      en: Overload 95-96 contact open (defective)
  - id: m_welded
    target: M
    kind: welded
    label: {fr: Contacts du contacteur M soudés, en: Contactor M contacts welded}
  - id: f6_blown
    target: F6
    kind: blown
    label: {fr: Fusible secondaire F6 grillé, en: Secondary fuse F6 blown}
  - id: f2_blown
    target: F2
    kind: blown
    label:
      fr: Fusible principal F2 grillé (marche monophasée)
      en: Main fuse F2 blown (single phasing)
  - id: f4_blown
    target: F4
    kind: blown
    label:
      fr: Fusible primaire F4 du transformateur grillé
      en: CPT primary fuse F4 blown
  - id: m_coil_open
    target: M
    kind: coil_open
    label: {fr: Bobine du contacteur M ouverte (brûlée), en: Contactor M coil open (burnt)}
  - id: m_aux_open
    target: M
    kind: aux_open
    label:
      fr: Contact d'auto-maintien M 13-14 ne ferme pas
      en: Seal-in contact M 13-14 does not close
  - id: stop_open
    target: PB_STOP
    kind: contact_open
    label: {fr: Contact NF du bouton ARRÊT ouvert, en: STOP button NC contact open}
  - id: motor_winding
    target: MTR
    kind: winding_open
    label: {fr: Enroulement du moteur ouvert (phase T2), en: Motor winding open (T2)}
  - id: lamp_burnt
    target: LT_RUN
    kind: burnt
    label: {fr: Ampoule du voyant MARCHE brûlée, en: RUN pilot lamp burnt out}
  - id: q0_welded
    target: Q0
    kind: welded
    label: {fr: Contact de la sortie API %QX0.0 soudé, en: PLC output %QX0.0 contact welded}
plc:
  io:
    - address: "%IX0.0"
      component: I0
      label: {fr: MARCHE (NO), en: START (NO)}
    - address: "%IX0.1"
      component: I1
      label: {fr: "ARRÊT (NF : vrai = pas appuyé)", en: "STOP (NC: true = not pressed)"}
    - address: "%IX0.2"
      component: I2
      label: {fr: Surcharge déclenchée, en: Overload tripped}
    - address: "%IX0.3"
      component: I3
      label: {fr: Arrêt d'urgence OK, en: E-stop healthy}
    - address: "%IX0.4"
      component: I4
      label: {fr: Retour de marche (M 13-14), en: Run feedback (M 13-14)}
    - address: "%QX0.0"
      component: Q0
      label: {fr: Bobine du contacteur M, en: Contactor M coil}
    - address: "%QX0.1"
      component: Q1
      label: {fr: Voyant MARCHE, en: RUN light}
  starterProgram: |
    PROGRAM Main
    VAR
        Marche      AT %IX0.0 : BOOL;   (* Bouton MARCHE, NO *)
        Arret       AT %IX0.1 : BOOL;   (* Bouton ARRÊT, NF : TRUE quand non appuyé *)
        Surcharge   AT %IX0.2 : BOOL;   (* Relais de surcharge déclenché (97-98) *)
        AU_OK       AT %IX0.3 : BOOL;   (* Arrêt d'urgence relâché *)
        RetourM     AT %IX0.4 : BOOL;   (* Contact auxiliaire M 13-14 *)
        BobineM     AT %QX0.0 : BOOL;   (* Bobine du contacteur M *)
        VoyantMarche AT %QX0.1 : BOOL;  (* Voyant MARCHE *)
    END_VAR

    (* À compléter : logique d'auto-maintien *)

    END_PROGRAM
notes:
  - {text: {fr: CIRCUIT DE PUISSANCE 600 V, en: POWER CIRCUIT 600 V}, at: [40, 20], size: 13}
  - {text: {fr: CIRCUIT DE COMMANDE 120 V, en: CONTROL CIRCUIT 120 V}, at: [500, 395], size: 13}
