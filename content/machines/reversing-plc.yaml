# SPDX-License-Identifier: AGPL-3.0-only
# Inverseur de marche commandé par API
# Machine définie comme données : composants (types de la bibliothèque du
# simulateur), fils (numéros de fil), cadenassage et catalogue de défauts.
id: reversing-plc
version: 1
title: {fr: Inverseur de marche commandé par API, en: PLC-controlled reversing starter}
description:
  fr: "Même inverseur, mais la logique est dans l'API. L'arrêt d'urgence, la surcharge (95-96) et les contacts NF croisés restent câblés en
    série avec les bobines : le verrouillage matériel reste actif même si le programme est fautif. Au programme d'ajouter aussi le
    verrouillage logiciel."
  en: "Same reversing starter, but the logic lives in the PLC. The E-stop, overload (95-96) and cross-wired NC contacts stay hardwired in
    series with the coils: the hardware interlock still protects if the program is wrong. The program should add the software interlock
    too."
mode: plc
viewBox: [1300, 1000]
components:
  - id: SRC
    type: source3
    tag: Alim.
    label: {fr: Alimentation 600 V 3φ 60 Hz, en: 600 V 3-phase 60 Hz supply}
    params:
      vLL: 600
    parts:
      main: {at: [60, 40]}
  - id: DS
    type: disconnect3
