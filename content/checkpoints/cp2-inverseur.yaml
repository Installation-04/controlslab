  Un défaut a été introduit au hasard sur l'**inverseur de marche** (deux contacteurs, verrouillage électrique). **Aucun indice** n'est offert.
  Trouvez la cause par vos mesures, **diagnostiquez**, cadenassez, réparez, puis remettez en service. Note de passage : 80 %.
