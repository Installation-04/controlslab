# SPDX-License-Identifier: AGPL-3.0-only
# Démarreur direct 3 fils (câblé)
# Machine définie comme données : composants (types de la bibliothèque du
# simulateur), fils (numéros de fil), cadenassage et catalogue de défauts.
# Voir CONTRIBUTING.md pour le format.
id: motor-starter-3w
version: 1
title:
  fr: Démarreur direct 3 fils (câblé)
  en: 3-wire across-the-line starter (hardwired)
description:
  fr: "Démarreur magnétique pleine tension pour moteur 600 V, commande 120 V par transformateur. Circuit de commande à 3 fils : ARRÊT NF,
    arrêt d'urgence, MARCHE NO avec contact d'auto-maintien M 13-14, relais de surcharge 95-96."
  en: "Full-voltage magnetic starter for a 600 V motor, 120 V control from a CPT. 3-wire control: NC STOP, E-stop, NO START with M 13-14
    seal-in, overload 95-96."
mode: hardwired
viewBox: [1100, 700]
components:
  - id: SRC
    type: source3
    tag: Alim.
    label: {fr: Alimentation 600 V 3φ 60 Hz, en: 600 V 3-phase 60 Hz supply}
    params:
      vLL: 600
    parts:
      main: {at: [60, 40]}
  - id: DS
    type: disconnect3
    tag: SA
    label: {fr: Sectionneur principal (cadenassable), en: Main disconnect (lockable)}
    parts:
      main: {at: [60, 80]}
  - id: F1
    type: fuse
    tag: F1
    params:
      rating: 10
    label: {fr: Fusible principal L1 (10 A), en: Main fuse L1 (10 A)}
    parts:
      main: {at: [60, 170], rot: 90}
  - id: F2
    type: fuse
    tag: F2
    params:
      rating: 10
    label: {fr: Fusible principal L2 (10 A), en: Main fuse L2 (10 A)}
    parts:
      main: {at: [110, 170], rot: 90}
  - id: F3
    type: fuse
    tag: F3
    params:
      rating: 10
    label: {fr: Fusible principal L3 (10 A), en: Main fuse L3 (10 A)}
    parts:
      main: {at: [160, 170], rot: 90}
  - id: PE
    type: ground
    tag: MALT
    label: {fr: Barre de mise à la terre (boîtier), en: Ground bar (enclosure)}
    parts:
      main: {at: [230, 130]}
  - id: F4
    type: fuse
    tag: F4
    params:
      rating: 1
    label: {fr: Fusible primaire TC (1 A), en: CPT primary fuse (1 A)}
    parts:
      main: {at: [250, 250]}
  - id: F5
    type: fuse
    tag: F5
    params:
      rating: 1
    label: {fr: Fusible primaire TC (1 A), en: CPT primary fuse (1 A)}
    parts:
      main: {at: [250, 280]}
  - id: XF
    type: transformer
    tag: TC
    params:
      ratio: 5
    label:
      fr: Transformateur de commande 600/120 V, 250 VA
      en: Control transformer 600/120 V, 250 VA
    parts:
      main: {at: [360, 300]}
  - id: F6
    type: fuse
    tag: F6
    params:
      rating: 2
    label: {fr: Fusible secondaire (2 A), en: Secondary fuse (2 A)}
    parts:
      main: {at: [400, 420]}
  - id: GX
    type: ground
    tag: X2
    label: {fr: Mise à la terre du secondaire X2, en: X2 secondary bond}
    parts:
      main: {at: [440, 400]}
  - id: TB1
    type: terminal
    tag: "1"
    parts:
      main: {at: [500, 420]}
  - id: TB0
    type: terminal
    tag: X2
    parts:
      main: {at: [1040, 420]}
  - id: MTR
    type: motor3
    tag: M1
    params:
      vLL: 600
      fla: 5.2
    label: {fr: "Moteur 5 HP, 600 V, 5,2 A PC", en: "Motor 5 HP, 600 V, 5.2 FLA"}
    parts:
      main: {at: [60, 500]}
  - id: M
    type: contactor
    tag: M
    label: {fr: Contacteur moteur M (bobine 120 V), en: Motor contactor M (120 V coil)}
    parts:
      poles: {at: [60, 290]}
      coil: {at: [800, 460]}
      aux: {at: [700, 510]}
  - id: OL
    type: overload
    tag: OL
    params:
      fla: 5.2
    label:
      fr: Relais de surcharge thermique (réglé à 5,2 A)
      en: Thermal overload relay (set at 5.2 A)
    parts:
      heaters: {at: [60, 390]}
      nc: {at: [900, 460]}
      no: {at: [520, 620]}
  - id: PB_STOP
    type: pushbutton
    tag: PB1
    params:
      contact: NC
      kind: momentary
      color: red
    label: {fr: Bouton ARRÊT (NF), en: STOP button (NC)}
    parts:
      main: {at: [520, 460]}
  - id: PB_ES
    type: pushbutton
    tag: AU
    params:
      contact: NC
      kind: mushroom
      color: red
    label: {fr: "Arrêt d'urgence (NF, à accrochage)", en: "Emergency stop (NC, latching)"}
    parts:
      main: {at: [610, 460]}
  - id: PB_START
    type: pushbutton
    tag: PB2
    params:
      contact: NO
      kind: momentary
      color: green
    label: {fr: Bouton MARCHE (NO), en: START button (NO)}
    parts:
      main: {at: [700, 460]}
  - id: J3
    type: terminal
    tag: "3"
    parts:
      main: {at: [685, 460]}
  - id: J4
    type: terminal
    tag: "4"
    parts:
      main: {at: [780, 460]}
  - id: J1A
    type: terminal
    parts:
      main: {at: [500, 460]}
  - id: J1B
    type: terminal
    parts:
      main: {at: [500, 620]}
  - id: J0A
    type: terminal
    parts:
      main: {at: [1040, 460]}
  - id: J0B
    type: terminal
    parts:
      main: {at: [1040, 560]}
  - id: J0C
    type: terminal
    parts:
      main: {at: [1040, 620]}
  - id: LT_RUN
    type: lamp
    tag: LV
    params:
      color: green
    label: {fr: Voyant MARCHE (vert), en: RUN pilot light (green)}
    parts:
      main: {at: [800, 560]}
  - id: LT_OL
    type: lamp
    tag: LA
    params:
      color: amber
    label: {fr: Voyant SURCHARGE (ambre), en: OVERLOAD pilot light (amber)}
    parts:
      main: {at: [900, 620]}
wires:
