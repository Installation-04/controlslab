    - address: "%QX0.0"
      component: Q0
      label: {fr: Bobine KF (avant), en: KF coil (forward)}
    - address: "%QX0.1"
      component: Q1
      label: {fr: Bobine KR (arrière), en: KR coil (reverse)}
    - address: "%QX0.2"
      component: Q2
