  starterProgram: |
    PROGRAM Main
    VAR
        Avant        AT %IX0.0 : BOOL;   (* MARCHE AVANT, NO *)
        Arriere      AT %IX0.1 : BOOL;   (* MARCHE ARRIÈRE, NO *)
        Arret        AT %IX0.2 : BOOL;   (* ARRÊT, NF : TRUE quand non appuyé *)
        Surcharge    AT %IX0.3 : BOOL;   (* surcharge déclenchée (97-98) *)
        RetourKF     AT %IX0.4 : BOOL;   (* contact auxiliaire KF 13-14 *)
        RetourKR     AT %IX0.5 : BOOL;   (* contact auxiliaire KR 13-14 *)
        AU_OK        AT %IX0.6 : BOOL;   (* arrêt d'urgence relâché *)
        BobineKF     AT %QX0.0 : BOOL;   (* bobine du contacteur AVANT *)
        BobineKR     AT %QX0.1 : BOOL;   (* bobine du contacteur ARRIÈRE *)
        VoyantAvant  AT %QX0.2 : BOOL;
        VoyantArriere AT %QX0.3 : BOOL;
    END_VAR

